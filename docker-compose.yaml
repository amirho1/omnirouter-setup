services:
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - omniroute-internal

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - NODE_ENV=production
      - PORT=20128
      - API_PORT=20129
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379
      - REQUIRE_API_KEY=true
      - NEXT_PUBLIC_BASE_URL=https://aiproxy.web-father.ir
      - BASE_URL=http://localhost:20128
      - OMNIROUTE_TRUST_PROXY=true
      - AUTH_COOKIE_SECURE=true
      # Provide these in Dokploy's "Environment" tab:
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD}
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - omniroute-internal
      - dokploy-network

volumes:
  omniroute-data:
  redis-data:

networks:
  omniroute-internal:
    driver: bridge
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}